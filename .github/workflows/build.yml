name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest="${{ inputs.test-filter }}" -Dsurefire.failIfNoSpecifiedTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: Report skipped tests
        run: |
          for f in */target/surefire-reports/TEST-*.xml; do
            python3 - "$f" <<'EOF'
          import os, re, sys, xml.etree.ElementTree as ET
          module = sys.argv[1].split('/')[0]
          for tc in ET.parse(sys.argv[1]).getroot().iter('testcase'):
              s = tc.find('skipped')
              if s is None:
                  continue
              cls, name = tc.get('classname'), tc.get('name')
              print('SKIPPED: %s.%s -- reason: %s' % (cls, name, s.get('message') or (s.text or '').strip() or 'no message'))
              # Name the test's own assume*() guard that did not hold for this case
              src = os.path.join(module, 'src/test/java', cls.replace('.', '/') + '.java')
              method = name.split('[')[0]
              if os.path.exists(src):
                  lines = open(src).read().splitlines()
                  start = next((i for i, l in enumerate(lines) if re.search(r'void\s+%s\s*\(' % re.escape(method), l)), None)
                  if start is not None:
                      for i in range(start, min(start + 15, len(lines))):
                          if re.search(r'\bassume\w*\(', lines[i]):
                              print('  guard not satisfied for this parameterization: %s:%d: %s' % (src, i + 1, lines[i].strip()))
          EOF
          done
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-2.9.0.jar
          if-no-files-found: error
